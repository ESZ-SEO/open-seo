services:
  # Combined image: the app + the render pipeline's Chrome runtime in one
  # container. Built from Dockerfile.selfhost.render (which layers on top of
  # the published upstream image — see that file's header comment for why).
  # Set OPEN_SEO_BASE_IMAGE to pin a specific upstream tag instead of :latest.
  open-seo:
    build:
      context: .
      dockerfile: Dockerfile.selfhost.render
      args:
        BASE_IMAGE: ${OPEN_SEO_BASE_IMAGE:-ghcr.io/every-app/open-seo:latest}
    restart: unless-stopped
    # Forward EVERY .env value into the container. The explicit `environment:`
    # list below still wins for the values it names — without this, any .env
    # value not listed there (e.g. OPENROUTER_API_KEY) silently never reached
    # the app. Compose errors if .env is missing; the quickstart's
    # `cp .env.example .env` creates it.
    env_file:
      - .env
    # Anonymous usage heartbeat controls: docs/SELF_HOSTING_DOCKER.md#telemetry
    environment:
      # Required for local Docker self-hosting: exposes Compose env vars to cloudflare:workers bindings.
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=${PORT:-3001}
      - ALLOWED_HOST=${ALLOWED_HOST:-}
      - AUTH_MODE=local_noauth
      - OPENSEO_TELEMETRY_DISABLED=${OPENSEO_TELEMETRY_DISABLED:-}
      - DO_NOT_TRACK=${DO_NOT_TRACK:-}
      - DATAFORSEO_API_KEY=${DATAFORSEO_API_KEY}
      # Optional: AI features (SAM, onboarding chat). Without this the setup
      # gate in the app asks for the key, but nothing here would forward it.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      # Optional: Google Search Console. See
      # docs/SELF_HOSTING_GOOGLE_SEARCH_CONSOLE.md
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - VITE_SHOW_DEVTOOLS=false
      # Visual report generator (render pipeline). RENDER_API_TOKEN must be set
      # or /api/render/ refuses every request with 503. RENDERER_URL is NOT
      # listed here on purpose — docker-entrypoint.combined.sh defaults it to
      # http://localhost:3100 (same container); only set it in .env if you
      # later point at an external renderer.
      - RENDER_API_TOKEN=${RENDER_API_TOKEN:-}
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    volumes:
      - open_seo_data:/app/.wrangler
    # Guardrail while we measure real RAM usage (Puppeteer/Chromium now shares
    # this container's memory). Adjust once we have real numbers — see
    # docs/SELF_HOSTING_EASYPANEL.md. `unless-stopped` above means Docker
    # restarts the container if Chrome ever pushes it over this limit instead
    # of the host silently swapping/thrashing.
    mem_limit: 1536m
volumes:
  open_seo_data:
